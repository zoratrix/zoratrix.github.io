<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мои учебники</title>
  <style>
    /* ── Общие стили ── */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      color: #e0e0e0;
      padding: 2rem;
    }

    /* ── Заголовок ── */
    h1 {
      font-size: 2.2rem;
      margin-bottom: 0.5rem;
      text-align: center;
    }

    .subtitle {
      font-size: 1.1rem;
      color: #aaa;
      margin-bottom: 2.5rem;
      text-align: center;
    }

    /* ── Карточки-ссылки ── */
    .cards {
      display: flex;
      flex-wrap: wrap;
      gap: 2rem;
      justify-content: center;
      max-width: 800px;
      width: 100%;
    }

    .card {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 2rem 2.4rem;
      width: 340px;
      text-decoration: none;
      color: inherit;
      transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
      backdrop-filter: blur(6px);
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 12px 32px rgba(100, 100, 255, 0.25);
      background: rgba(255, 255, 255, 0.10);
    }

    .card-icon {
      font-size: 2.8rem;
      margin-bottom: 1rem;
    }

    .card h2 {
      font-size: 1.4rem;
      margin-bottom: 0.6rem;
      color: #fff;
    }

    .card p {
      font-size: 0.95rem;
      color: #bbb;
      line-height: 1.5;
    }

    /* ── Футер ── */
    footer {
      margin-top: 3rem;
      font-size: 0.85rem;
      color: #666;
    }
  </style>
</head>
<body>

  <h1>Онлайн-учебники</h1>
  <p class="subtitle">Кликните для перехода к нужному</p>

  <div class="cards">

    <!-- ========== УЧЕБНИК 1 ========== -->
    <a class="card" href="https://urbakhed.cloud.gram.ax/iot-book" target="_blank">
      <div class="card-icon">💻</div>
      <h2>Интернет вещей</h2>
      <p>Ну тут описание для интернета вещей</p>
    </a>

    <!-- ========== УЧЕБНИК 2 ========== -->
    <a class="card" href="https://urbakhed.cloud.gram.ax/robots-book-gramax" target="_blank">
      <div class="card-icon">🤖</div>
      <h2>Эксплуатация сервисных роботов</h2>
      <p>А тут конечно же для ЭСР тоже какое-то описание</p>
    </a>

  </div>

  <footer>© 2026 — Екатерина Урбах</footer>

</body>
</html>
